    <ellipse cx="26" cy="6" rx="7" ry="4.5" fill="#f472b6" opacity="0.85" />
    <path d="M -15,12 Q 0,26 15,12" fill="none" stroke="#854d0e" stroke-width="4" stroke-linecap="round" />
