      <g transform="rotate(0)"><path d="M -13,-70 C -13,-98 -7,-125 0,-125 C 7,-125 13,-98 13,-70 Z" fill="#fde047" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round" /></g>
      <g transform="rotate(22.5)"><path d="M -10.5,-70 C -10.5,-90 -6,-112 0,-112 C 6,-112 10.5,-90 10.5,-70 Z" fill="#facc15" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round" /></g>
      <g transform="rotate(45)"><path d="M -13,-70 C -13,-98 -7,-125 0,-125 C 7,-125 13,-98 13,-70 Z" fill="#fde047" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round" /></g>
      <g transform="rotate(67.5)"><path d="M -10.5,-70 C -10.5,-90 -6,-112 0,-112 C 6,-112 10.5,-90 10.5,-70 Z" fill="#facc15" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round" /></g>
      <g transform="rotate(90)"><path d="M -13,-70 C -13,-98 -7,-125 0,-125 C 7,-125 13,-98 13,-70 Z" fill="#fde047" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round" /></g>
      <g transform="rotate(112.5)"><path d="M -10.5,-70 C -10.5,-90 -6,-112 0,-112 C 6,-112 10.5,-90 10.5,-70 Z" fill="#facc15" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round" /></g>
      <g transform="rotate(135)"><path d="M -13,-70 C -13,-98 -7,-125 0,-125 C 7,-125 13,-98 13,-70 Z" fill="#fde047" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round" /></g>
      <g transform="rotate(157.5)"><path d="M -10.5,-70 C -10.5,-90 -6,-112 0,-112 C 6,-112 10.5,-90 10.5,-70 Z" fill="#facc15" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round" /></g>
      <g transform="rotate(180)"><path d="M -13,-70 C -13,-98 -7,-125 0,-125 C 7,-125 13,-98 13,-70 Z" fill="#fde047" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round" /></g>
      <g transform="rotate(202.5)"><path d="M -10.5,-70 C -10.5,-90 -6,-112 0,-112 C 6,-112 10.5,-90 10.5,-70 Z" fill="#facc15" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round" /></g>
      <g transform="rotate(225)"><path d="M -13,-70 C -13,-98 -7,-125 0,-125 C 7,-125 13,-98 13,-70 Z" fill="#fde047" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round" /></g>
      <g transform="rotate(247.5)"><path d="M -10.5,-70 C -10.5,-90 -6,-112 0,-112 C 6,-112 10.5,-90 10.5,-70 Z" fill="#facc15" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round" /></g>
      <g transform="rotate(270)"><path d="M -13,-70 C -13,-98 -7,-125 0,-125 C 7,-125 13,-98 13,-70 Z" fill="#fde047" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round" /></g>
      <g transform="rotate(292.5)"><path d="M -10.5,-70 C -10.5,-90 -6,-112 0,-112 C 6,-112 10.5,-90 10.5,-70 Z" fill="#facc15" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round" /></g>
      <g transform="rotate(315)"><path d="M -13,-70 C -13,-98 -7,-125 0,-125 C 7,-125 13,-98 13,-70 Z" fill="#fde047" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round" /></g>
      <g transform="rotate(337.5)"><path d="M -10.5,-70 C -10.5,-90 -6,-112 0,-112 C 6,-112 10.5,-90 10.5,-70 Z" fill="#facc15" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round" /></g>
    </g>
    <circle cx="0" cy="0" r="72" fill="#fde047" stroke="#f59e0b" stroke-width="5" />
    <!-- Friendly smiling face on the sun -->
    <circle cx="-20" cy="-10" r="6.5" fill="#854d0e" />
    <circle cx="20" cy="-10" r="6.5" fill="#854d0e" />
    <circle cx="-18" cy="-12" r="2.5" fill="#ffffff" />
    <circle cx="22" cy="-12" r="2.5" fill="#ffffff" />
