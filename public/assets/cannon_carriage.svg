<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 62" width="180" height="62">
  <defs>
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="wheelHub">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#713f12" />
    </radialGradient>
  </defs>

  <!-- Wooden Carriage Mount Body -->
  <path
    d="M 32,15 C 32,8 45,2 90,2 C 135,2 148,8 148,15 L 158,54 C 158,58 152,60 144,60 L 36,60 C 28,60 22,58 22,54 Z"
    fill="url(#woodGradient)"
    stroke="#451a03"
    stroke-width="4"
  />

  <!-- Carriage Brass Rivet Details -->
  <circle cx="90" cy="18" r="6" fill="url(#wheelHub)" stroke="#451a03" stroke-width="2" />
  <circle cx="65" cy="40" r="4" fill="#fde047" stroke="#451a03" stroke-width="1.5" />
  <circle cx="115" cy="40" r="4" fill="#fde047" stroke="#451a03" stroke-width="1.5" />

  <!-- Left Big Chunky Wooden Wheel -->
  <circle cx="28" cy="38" r="22" fill="#78350f" stroke="#451a03" stroke-width="4" />
  <circle cx="28" cy="38" r="16" fill="#92400e" stroke="#fde047" stroke-width="3" />
  <circle cx="28" cy="38" r="7" fill="url(#wheelHub)" stroke="#451a03" stroke-width="2" />

  <!-- Right Big Chunky Wooden Wheel -->
  <circle cx="152" cy="38" r="22" fill="#78350f" stroke="#451a03" stroke-width="4" />
  <circle cx="152" cy="38" r="16" fill="#92400e" stroke="#fde047" stroke-width="3" />
  <circle cx="152" cy="38" r="7" fill="url(#wheelHub)" stroke="#451a03" stroke-width="2" />
</svg>
